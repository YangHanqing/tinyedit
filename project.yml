name: TinyEdit
options:
  bundleIdPrefix: cn.hqyang
  deploymentTarget:
    macOS: "15.0"
  developmentRegion: en
  knownRegions:
    - en
    - zh-Hans
    - zh-Hant
    - ja
    - ko
    - de
    - fr
    - es
  createIntermediateGroups: true
settings:
  base:
    # Shared by the app and its Quick Look extension, which must carry the same version.
    # The patch number goes up with each feature.
    MARKETING_VERSION: "0.2.17"
    # yyyyMMddHHmm. scripts/install.sh stamps the minute it builds.
    CURRENT_PROJECT_VERSION: "202610211409"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ARCHS: arm64
    EXCLUDED_ARCHS: x86_64
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
    Release:
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
targets:
  TinyEdit:
    type: application
    platform: macOS
    sources:
      - path: TinyEdit
    dependencies:
      - target: TinyEditQuickLook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.hqyang.tinyedit
        PRODUCT_NAME: TinyEdit
        ENABLE_APP_SANDBOX: YES
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: TinyEdit/TinyEdit.entitlements
        INFOPLIST_FILE: TinyEdit/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # A separate identity lets the test host launch while the installed app is running.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: cn.hqyang.tinyedit.debug
  # Quick Look (Space in Finder) for Markdown. It compiles the preview's sources itself: this list is
  # what the Markdown preview needs; the curl and JSON files come in only through the image loader, the
  # editing ones through the Markdown highlighter's task rule.
  TinyEditQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: TinyEditQuickLook
      - path: TinyEdit/Markdown
        excludes: [MarkdownPreview.swift]
      - path: TinyEdit/Highlighting
        excludes: [HighlightController.swift, HighlightDiff.swift]
      - TinyEdit/Theme/Theme.swift
      - TinyEdit/Models/EditorLanguage.swift
      - TinyEdit/Models/TextEncoding.swift
      - TinyEdit/Models/LineEnding.swift
      - TinyEdit/Files/FileLoader.swift
      - TinyEdit/Utilities/ContentHash.swift
      - TinyEdit/Utilities/AppPaths.swift
      - TinyEdit/Tools/RemoteImageLoader.swift
      - TinyEdit/Tools/CurlRunner.swift
      - TinyEdit/Tools/CurlCommand.swift
      - TinyEdit/Tools/JSONFormatter.swift
      - TinyEdit/Models/ContentLanguageDetector.swift
      - TinyEdit/Editor/TaskList.swift
      - TinyEdit/Editor/LineEditing.swift
      - TinyEdit/Editor/Indentation.swift
      - TinyEdit/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.hqyang.tinyedit.quicklook
        PRODUCT_NAME: TinyEditQuickLook
        ENABLE_APP_SANDBOX: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TinyEditQuickLook/Info.plist
        CODE_SIGN_ENTITLEMENTS: TinyEditQuickLook/TinyEditQuickLook.entitlements
      configs:
        # An embedded extension's identifier must start with its app's.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: cn.hqyang.tinyedit.debug.quicklook
  TinyEditTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TinyEditTests
    dependencies:
      - target: TinyEdit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.hqyang.tinyedit.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
schemes:
  TinyEdit:
    build:
      targets:
        TinyEdit: all
    test:
      targets:
        - TinyEditTests
